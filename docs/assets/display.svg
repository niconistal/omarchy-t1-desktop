    <rect y="36" width="540" height="44" rx="12" fill="#05060d" stroke="#ffffff" stroke-opacity="0.06"/>
    <rect x="12" y="48" width="40" height="20" rx="5" fill="#ffffff" fill-opacity="0.04"/>
    <text x="32" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#3b4261">esc</text>
    <rect x="62" y="50" width="400" height="16" rx="8" fill="#ffffff" fill-opacity="0.04"/>
    <text x="0" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#565f89">lock screen blanks · bar sleeps with it</text>
