  </filter>
</defs>
  <rect width="1280" height="168" rx="24" fill="#13141c" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(36 28)">
    <text x="0" y="18" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#9ece6a">display on</text>
    <rect y="36" width="540" height="44" rx="12" fill="#0e0e14" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="12" y="48" width="40" height="20" rx="5" fill="#ffffff" fill-opacity="0.10"/>
    <text x="32" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#c0caf5">esc</text>
    <rect x="62" y="50" width="280" height="16" rx="8" fill="url(#spectrum)"/>
    <g transform="translate(360 44)"><g transform="translate(0 0)" fill="#c0caf5">
      <path d="M 3 3 l 12 7 l -12 7 z"/>
